<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Teachers' Day</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat+Brush&family=Patrick+Hand&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<h1 class="sr">Happy Teachers' Day</h1>
<div class="frame">
  <div class="board" id="board">
    <canvas id="draw" aria-label="Chalkboard you can draw on"></canvas>
    <canvas id="fx" aria-hidden="true"></canvas>
    <div class="content">
      <svg class="title" viewBox="0 0 900 310" aria-hidden="true">
        <defs><filter id="rough"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="3.5"/></filter></defs>
        <g filter="url(#rough)">
          <text class="t" x="450" y="120" text-anchor="middle" font-size="138" style="--c:var(--pink);animation-delay:0s,3s">Happy</text>
          <text class="t" x="450" y="245" text-anchor="middle" font-size="124" style="--c:var(--chalk);animation-delay:1.1s,4s">Teachers' Day</text>
          <path class="u" d="M190 282 q 65 -20 130 0 t 130 0 t 130 0 t 130 0" style="stroke:var(--yellow);stroke-width:5;animation-delay:3.4s"/>
        </g>
      </svg>
      <p class="sub">Thank you for every lesson that outlasted the bell.</p>
      <form id="form">
        <input id="name" maxlength="40" placeholder="A teacher you want to thank" aria-label="Name of a teacher to thank" autocomplete="off">
        <button class="go" type="submit">Write on board</button>
      </form>
      <ul id="notes" aria-live="polite"></ul>
    </div>
  </div>
  <div class="tray" role="toolbar" aria-label="Chalk tools">
    <button class="chalk" data-c="#f4f1e6" style="--c:#f4f1e6" aria-label="White chalk" aria-pressed="true"></button>
    <button class="chalk" data-c="#ffd966" style="--c:#ffd966" aria-label="Yellow chalk" aria-pressed="false"></button>
    <button class="chalk" data-c="#ff9db8" style="--c:#ff9db8" aria-label="Pink chalk" aria-pressed="false"></button>
    <button class="chalk" data-c="#8bd8ff" style="--c:#8bd8ff" aria-label="Blue chalk" aria-pressed="false"></button>
    <button class="tool" id="eraser" aria-pressed="false">Eraser</button>
    <button class="tool" id="clear">Clear board</button>
    <button class="tool cheers" id="cheers">Cheers!</button>
  </div>
</div>
<script src="script.js"></script>
</body>
</html>
